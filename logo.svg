<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title description" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">NOX Hosting Pterodactyl theme</title>
  <desc id="description">Logo NOX Hosting : nuage blanc, trois serveurs bleus et lettrage blanc et bleu sur fond bleu nuit.</desc>
  <defs>
    <linearGradient id="serverBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08a5ed"/>
      <stop offset="1" stop-color="#0065c9"/>
    </linearGradient>
    <linearGradient id="serverFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8fb"/>
      <stop offset="1" stop-color="#d9e6ef"/>
    </linearGradient>
    <linearGradient id="blueText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11a5ed"/>
      <stop offset="1" stop-color="#0872d4"/>
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="640" height="640" fill="#050914"/>

  <!-- Nuage -->
  <path d="M 294,198
           C 282,190 273,189 263,189
           C 233,189 210,208 204,237
           C 172,237 147,260 147,291
           C 147,319 169,341 199,341
           L 398,341
           C 411,341 421,336 431,328"
        fill="none" stroke="#f3f5f7" stroke-width="19"
        stroke-linecap="butt" stroke-linejoin="round"/>

  <!-- Châssis des trois serveurs -->
  <g stroke="#082957" stroke-width="2.5">
    <rect x="309" y="140" width="188" height="54" rx="14" fill="url(#serverBlue)"/>
    <rect x="309" y="204" width="188" height="50" rx="14" fill="url(#serverBlue)"/>
    <rect x="309" y="264" width="188" height="54" rx="14" fill="url(#serverBlue)"/>
  </g>
  <g fill="url(#serverFace)">
    <rect x="323" y="153" width="162" height="28" rx="3"/>
    <rect x="323" y="214" width="162" height="30" rx="3"/>
    <rect x="323" y="277" width="162" height="28" rx="3"/>
  </g>

  <!-- Voyants et ports -->
  <g fill="#1264a8">
    <rect x="332" y="160" width="12" height="15"/>
    <rect x="351" y="160" width="12" height="15"/>
    <rect x="370" y="160" width="12" height="15"/>
    <rect x="332" y="283" width="12" height="15"/>
    <rect x="351" y="283" width="12" height="15"/>
    <rect x="370" y="283" width="12" height="15"/>
  </g>
  <g fill="#1264a8">
    <circle cx="447" cy="168" r="6.5"/>
    <circle cx="467" cy="168" r="6.5"/>
    <circle cx="447" cy="291" r="6.5"/>
    <circle cx="467" cy="291" r="6.5"/>
  </g>
  <g fill="#f5f8fa">
    <rect x="323" y="221" width="12" height="16"/>
    <rect x="342" y="221" width="12" height="16"/>
    <rect x="361" y="221" width="12" height="16"/>
    <circle cx="394" cy="230" r="6.5"/>
    <circle cx="414" cy="230" r="6.5"/>
    <rect x="435" y="221" width="12" height="16"/>
    <rect x="454" y="221" width="12" height="16"/>
    <rect x="473" y="221" width="12" height="16"/>
  </g>

  <!-- Nom de marque -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="116" text-anchor="middle" dominant-baseline="alphabetic">
    <text x="191" y="455" fill="#f4f6f7" textLength="106" lengthAdjust="spacingAndGlyphs">N</text>
    <text x="317" y="455" fill="#f4f6f7" textLength="116" lengthAdjust="spacingAndGlyphs">O</text>
    <text x="444" y="455" fill="url(#blueText)" textLength="120" lengthAdjust="spacingAndGlyphs">X</text>
  </g>

  <!-- HOSTING -->
  <g fill="url(#blueText)" stroke="#06366a" stroke-width="1.4" paint-order="stroke fill"
     font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="800" text-anchor="middle">
    <text x="155" y="501" textLength="36" lengthAdjust="spacingAndGlyphs">H</text>
    <text x="217" y="501" textLength="37" lengthAdjust="spacingAndGlyphs">O</text>
    <text x="278" y="501" textLength="34" lengthAdjust="spacingAndGlyphs">S</text>
    <text x="336" y="501" textLength="36" lengthAdjust="spacingAndGlyphs">T</text>
    <text x="381" y="501" textLength="12" lengthAdjust="spacingAndGlyphs">I</text>
    <text x="425" y="501" textLength="37" lengthAdjust="spacingAndGlyphs">N</text>
    <text x="486" y="501" textLength="36" lengthAdjust="spacingAndGlyphs">G</text>
  </g>

  <!-- Filets et mention FREE SERVER -->
  <g stroke="#7fa9c8" stroke-width="1.1" opacity="0.9">
    <path d="M137 524 H185"/>
    <path d="M455 524 H503"/>
  </g>
  <text x="320" y="532" fill="#f1f3f5" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500"
        letter-spacing="2">Pterodactyl theme</text>
</svg>
